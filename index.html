/* Layout: full-page key-art background under a soft veil; every readable surface is an opaque taped paper card (hero label, tabs, chips, headings, goods cards).
   Index-tab series switch, label-sticker filters, goods cards stuck on with masking tape and rubber stamps, notebook tab bar. */
:root{
  --paper:#FBFCFE; --grid:#E2E9F3; --margin:#F4B8C6; --card:#FFFFFF; --ink:#2A2730; --muted:#706A7A; --shade:#2A2730;
  --pink:#FAC6D4; --pink-ink:#D4467A; --sky:#C4E0F3; --sky-ink:#3A7DAF;
  --butter:#FDE69A; --butter-ink:#A97C00; --navy:#2D3B6E; --mint:#C6EBD5; --mint-ink:#23855A;
  --stamp:#E0475B; --hi:#FFE58A; --washop:1; --washveil:.46;
  --tapeA:var(--pink); --tapeB:var(--sky);
  --f-hand:"Gaegu","Nanum Pen Script",cursive;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1B1F2E; --grid:#283049; --margin:#5A3245; --card:#242A3D; --ink:#F3EEE4; --muted:#ADA7BA; --shade:#0C0E16;
  --pink:#6B3549; --pink-ink:#F59BBB; --sky:#2C4A63; --sky-ink:#8FC6EC;
  --butter:#5E4C17; --butter-ink:#F3CF62; --navy:#AEBDF2; --mint:#21483A; --mint-ink:#7BD6A6;
  --stamp:#FF7A8A; --hi:#6A5A1E; --washop:1; --washveil:.68; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1B1F2E; --grid:#283049; --margin:#5A3245; --card:#242A3D; --ink:#F3EEE4; --muted:#ADA7BA; --shade:#0C0E16;
  --pink:#6B3549; --pink-ink:#F59BBB; --sky:#2C4A63; --sky-ink:#8FC6EC;
  --butter:#5E4C17; --butter-ink:#F3CF62; --navy:#AEBDF2; --mint:#21483A; --mint-ink:#7BD6A6;
  --stamp:#FF7A8A; --hi:#6A5A1E; --washop:1; --washveil:.68; color-scheme:dark}
body[data-series="kon"]{--tapeA:var(--butter);--tapeB:var(--sky)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}

const CATS=[["figure","피규어"],["plush","인형·마스코트"],["keyring","키링·참"],["stationery","문구·아크릴"],["gacha","가챠·쿠지"],["apparel","의류·패션"],["living","생활용품"],["food","콜라보 푸드"],["event","팝업·행사"],["media","애니·영화·방송"]];
const CATN=Object.fromEntries(CATS);
const state={series:"all",region:"all",cat:"all",q:"",ended:false,view:"feed",items:[],shops:[],marks:{},loaded:false,db:null,uid:null,open:new Set(),seen:new Set(),slam:null,memos:[],delAsk:null,bkOpen:false,mine:[],remote:[]};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TODAY=new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const days=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function tilt(id){let h=0;for(const ch of String(id))h=(h*31+ch.charCodeAt(0))|0;return((h%17)/17*1.6).toFixed(2)+"deg"}
function status(it){
  if(it.end&&it.end<TODAY)return{k:"done",label:"종료"};
  if(it.start&&it.start>TODAY)return{k:"soon",label:it.kind==="release"?"출시 예정":["media","game","book"].includes(it.kind)?"공개 예정":"오픈 예정"};
  if(it.kind==="release"&&!it.end)return{k:"live",label:"출시됨"};
  if(it.kind==="store")return{k:"live",label:"상시"};
  return{k:"live",label:"진행 중"};
}
function fmt(d){if(!d)return"";const[y,m,dd]=d.split("-");return(y!==TODAY.slice(0,4)?y.slice(2)+".":"")+m+"."+dd}
function stampHTML(it,st){
  let top=st.label,big="";
  if(st.k==="soon"){top=st.label.replace(" 예정","");big=it.approx?"예정":"D-"+days(TODAY,it.start)}
  else if(st.k==="live"&&it.end){const n=days(TODAY,it.end);top="마감";big=n===0?"오늘":"D-"+n}
  else if(st.k==="live"){if(it.kind==="store"){top="상시";big="운영"}else if(it.kind==="release"||it.kind==="collab"){top="지금";big="판매중"}else{top="지금";big="진행중"}}
  else{top="종료";big=fmt(it.end)}
  return`<div class="stampbox ${st.k}" aria-label="${esc(st.label)}"><div><b>${esc(top)}</b><span>${esc(big)}</span></div></div>`;
}

/* ---------- marks ---------- */
function loadLocal(){try{return JSON.parse(localStorage.getItem("tobeol-marks")||"{}")}catch(e){return{}}}
function saveLocal(){try{localStorage.setItem("tobeol-marks",JSON.stringify(state.marks))}catch(e){}}
let mt=null,mw=false,md=false;
function persistMarks(){
  saveLocal();if(!state.db||!state.uid)return;clearTimeout(mt);
  mt=setTimeout(async()=>{if(mw){md=true;return}mw=true;
    try{await state.db.doc("data/users/"+state.uid+"/marks").set({m:state.marks})}catch(e){}
    mw=false;if(md){md=false;persistMarks()}},600);
}

function loadMemos(){try{const v=JSON.parse(localStorage.getItem("tobeol-memos")||"[]");return Array.isArray(v)?v:[]}catch(e){return[]}}
function saveMemos(){try{localStorage.setItem("tobeol-memos",JSON.stringify(state.memos))}catch(e){toast("저장 공간이 막혀 있어서 메모가 안 남을 수 있어")}}
function addMemo(text,date,imp){state.memos.unshift({id:"m"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),text:text.slice(0,300),date:date||null,imp:!!imp,done:false,at:new Date().toISOString()});saveMemos()}
function memoDday(m){if(!m.date)return null;const n=days(TODAY,m.date);return{n,txt:n===0?"오늘":n>0?"D-"+n:"D+"+(-n)}}
function sortedMemos(){return state.memos.slice().sort((a,b)=>(a.done-b.done)||((b.imp?1:0)-(a.imp?1:0))||((a.date||"9999")).localeCompare(b.date||"9999")||(b.at||"").localeCompare(a.at||""))}
function memoCard(m){
  const d=memoDday(m),confirm=state.delAsk===m.id;
  return`<article class="memo ${m.done?"done":""}" data-mid="${esc(m.id)}" style="--tilt:${tilt(m.id)}">
    <span class="tape"></span>${m.imp&&!m.done?`<span class="imp-mark">중요</span>`:""}
    <p>${esc(m.text)}</p>
    ${m.done?`<span class="ok-stamp">끝!</span>`:""}
    <div class="memo-foot">${d?`<span class="dd ${!m.done&&d.n<=1?"hot":""}">${d.txt}</span><span>${fmt(m.date)}</span>`:""}<span class="sp"></span>
      <button class="mbtn" data-mdone="${esc(m.id)}">${m.done?"되돌리기":"다 했어"}</button>
      <button class="mbtn ${confirm?"warn":""}" data-mdel="${esc(m.id)}">${confirm?"진짜 지울까?":"지우기"}</button></div>
  </article>`;
}
function memoView(){
  const list=sortedMemos();
  return`<section class="group"><h2><span>놓치면 안 되는 것</span><small>${list.filter(m=>!m.done).length}</small></h2>
    <form class="memo-new" id="memoForm"><span class="tape"></span>
      <label class="sr" for="mText" hidden>메모</label>
      <textarea id="mText" rows="2" maxlength="300" placeholder="예: 11/1 오전 11시 한복 마스코트 재입고, 오픈 30분 전 도착!"></textarea>
      <div class="memo-row"><input type="date" id="mDate" aria-label="날짜"><label class="imp"><input type="checkbox" id="mImp">중요</label><button class="add" type="submit">붙이기</button></div>
    </form>
    ${list.length?`<div class="memos">${list.map(memoCard).join("")}</div>`:empty("아직 메모가 없어<br>잊으면 안 되는 걸 위에 적어둬")}
  </section>
  <section class="backup"><b>메모 백업</b><span>메모와 찜 기록은 이 폰에만 저장돼. 폰을 바꾸거나 앱을 지우기 전에 백업을 복사해서 카톡 나와의 채팅 같은 곳에 붙여둬.</span>
    <div class="row2"><button class="mbtn" id="bkCopy" type="button">백업 복사</button><button class="mbtn" id="bkOpen" type="button">백업 불러오기</button></div>
    ${state.bkOpen?`<textarea id="bkText" placeholder="복사해 둔 백업을 여기에 붙여넣어"></textarea><div class="row2"><button class="mbtn warn" id="bkLoad" type="button">불러오기</button></div>`:""}
  </section>`;
}
function remindStrip(){
  const soon=state.memos.filter(m=>!m.done&&m.date&&days(TODAY,m.date)<=3).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);
  if(!soon.length)return"";
  return`<button class="remind" id="toMemo" type="button"><b>잊지 마!</b>${soon.map(m=>`<span><i>${memoDday(m).txt}</i>${esc(m.text.split("\n")[0].slice(0,60))}</span>`).join("")}</button>`;
}

/* ---------- filtering ---------- */
function matchQ(text){if(!state.q)return true;const t=text.toLowerCase();return state.q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>t.includes(w))}
function itemText(it){return[it.brand,it.title,it.summary,it.place,it.note,it.perks,it.price,SER[it.series],KIND[it.kind],...(it.cats||[]).map(c=>CATN[c]),...(it.regions||[]).map(r=>REG[r])].join(" ")}
function baseItems(ignoreCat){
  return state.items.filter(it=>{
    if(state.series!=="all"&&it.series!==state.series)return false;
    if(state.region!=="all"&&!(it.regions||[]).includes(state.region)&&!(["seoul","yongsan","busan"].includes(state.region)&&(it.regions||[]).includes("nationwide")))return false;
    if(!ignoreCat&&state.cat!=="all"&&!(it.cats||[]).includes(state.cat))return false;
    if(state.view==="mine")return!!state.marks[it.id]&&matchQ(itemText(it));
    if(!state.ended&&status(it).k==="done")return false;
    return matchQ(itemText(it));
  });
}
function shopsVisible(){
  return state.shops.filter(s=>{
    if(state.series!=="all"&&!(s.carries||[]).includes(state.series))return false;
    if(state.region!=="all"&&!(s.regions||[]).includes(state.region))return false;
    return matchQ([s.name,s.address,s.floor,s.note,s.goods,...(s.regions||[]).map(r=>REG[r])].join(" "));
  });
}

/* ---------- render ---------- */
function renderCats(){
  const pool=baseItems(true);
  $("#cats").innerHTML=[`<button class="chip cat" data-c="all" aria-pressed="${state.cat==="all"}">전부</button>`]
    .concat(CATS.map(([k,l])=>{const n=pool.filter(i=>(i.cats||[]).includes(k)).length;
      return`<button class="chip cat" data-c="${k}" aria-pressed="${state.cat===k}">${l}<span class="n">${n}</span></button>`})).join("");
  $("#cats").hidden=state.view==="shops";
}

      ${period?`<div class="row"><span class="k">기간</span><span class="v">${period}</span></div>`:""}
      ${it.price?`<div class="row"><span class="k">가격</span><span class="v">${esc(it.price)}</span></div>`:""}
      ${open?`<div class="more">

        ${it.address?`<div class="row"><span class="k">주소</span><span class="v">${esc(it.address)}</span></div>`:""}
        ${it.perks?`<div class="row"><span class="k">특전</span><span class="v">${esc(it.perks)}</span></div>`:""}
        ${it.note?`<p class="note">${esc(it.note)}</p>`:""}

        <div class="src">${it.mine?"내가 적은 소식 (이 폰에만 저장)":it.addedBy==="user"?"직접 적은 소식":"자동으로 모은 소식"}${it.addedAt?" · "+esc(it.addedAt.slice(0,10)):""}</div></div>`:""}
    </div>

      <button class="act want" data-mark="want" data-id="${esc(it.id)}" aria-pressed="${m==="want"}">${m==="want"?"♥ 찜했어":"♡ 찜"}</button>
      <button class="act got" data-mark="got" data-id="${esc(it.id)}" aria-pressed="${m==="got"}">${m==="got"?"✓ 샀어":"샀어!"}</button>
      ${map?`<a class="act" href="${map}" target="_blank" rel="noopener">지도</a>`:""}
      <button class="act" data-tomemo="${esc(it.id)}">메모</button>
      <button class="act" data-more="${esc(it.id)}" aria-expanded="${open}">${open?"접기":"자세히"}</button>
      ${it.mine?`<button class="act" data-delmine="${esc(it.id)}">${state.delAsk===it.id?"진짜 지울까?":"지우기"}</button>`:""}

const empty=t=>`<div class="empty"><img src="${HACHI}" alt="">${t}</div>`;
function render(){
  renderCats();
  const feed=$("#feed");
  if(!state.loaded&&state.view!=="memo"){feed.innerHTML=empty("노트 펼치는 중…");return}
  let html="";
  const draft={t:$("#mText")?.value,d:$("#mDate")?.value,i:$("#mImp")?.checked,b:$("#bkText")?.value};
  if(state.view==="memo"){html=memoView()}
  else if(state.view==="shops"){
    const list=shopsVisible();
    html=list.length?`<section class="group"><h2><span>굿즈 사러 갈 곳</span><small>${list.length}</small></h2>${list.map(shopCard).join("")}</section>`
      :empty(state.shops.length?"조건에 맞는 판매처가 없어":"판매처를 아직 못 적었어");
  }else{
    const list=baseItems(false);
    if(!list.length){
      html=empty(state.view==="mine"?"아직 찜한 게 없어!<br>카드에서 ♡ 찜을 눌러봐":state.items.length?"이 조건엔 소식이 없어<br>검색어나 카테고리를 바꿔봐":"아직 적힌 소식이 없어<br>내일 아침에 채워둘게");
    }else{
      const groups=state.view==="mine"
        ?[["갖고 싶은 것",list.filter(i=>state.marks[i.id]==="want")],["토벌 완료",list.filter(i=>state.marks[i.id]==="got")]]
        :[["지금 갈 수 있어",list.filter(i=>status(i).k==="live"&&!["release","collab","media","game","book"].includes(i.kind))],
          ["곧 열려",list.filter(i=>status(i).k==="soon").sort((a,b)=>(a.start||"").localeCompare(b.start||""))],
          ["새로 나온 굿즈·소식",list.filter(i=>status(i).k==="live"&&["release","collab","media","game","book"].includes(i.kind)).sort((a,b)=>(b.start||"").localeCompare(a.start||""))],
          ["지난 소식",list.filter(i=>status(i).k==="done").sort((a,b)=>(b.end||"").localeCompare(a.end||""))]];
      html=groups.filter(g=>g[1].length).map(([h,a])=>`<section class="group"><h2><span>${h}</span><small>${a.length}</small></h2>${a.map(card).join("")}</section>`).join("");
    }
    if(state.view==="feed")html=remindStrip()+html;
  }
  feed.innerHTML=html;state.slam=null;
  if($("#mText")&&draft.t!=null){$("#mText").value=draft.t;$("#mDate").value=draft.d||"";$("#mImp").checked=!!draft.i}
  if($("#bkText")&&draft.b)$("#bkText").value=draft.b;
  feed.querySelectorAll(".memo").forEach((el,i)=>{const id="memo-"+el.dataset.mid;if(!state.seen.has(id)){state.seen.add(id);el.classList.add("in");el.style.animationDelay=Math.min(i,8)*50+"ms"}});
  feed.querySelectorAll(".card").forEach((el,i)=>{const id=el.dataset.id;if(!state.seen.has(id)){state.seen.add(id);el.classList.add("in");el.style.animationDelay=Math.min(i,8)*60+"ms"}});
}
function countUp(el,to){
  const from=+el.textContent||0;if(from===to)return;if(reduce){el.textContent=to;return}
  const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/700);el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0);
}
function renderStats(){
  const pool=state.items.filter(i=>state.series==="all"||i.series===state.series);
  countUp($("#nLive"),pool.filter(i=>status(i).k==="live").length);
  countUp($("#nSoon"),pool.filter(i=>status(i).k==="soon").length);
  countUp($("#nShop"),state.shops.filter(s=>state.series==="all"||(s.carries||[]).includes(state.series)).length);
  $("#noLabel").textContent=String(state.items.length).padStart(3,"0");
}


/* ---------- sparkle constellation ---------- */
const sky=$("#sky"),sx=sky.getContext("2d");let SW=0,SH=0,NODES=[],COMETS=[],PAL=[],DARK=false,last=0;
function hex(c){c=c.trim();if(c[0]!=="#")return[255,240,200];if(c.length===4)c="#"+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];return[1,3,5].map(i=>parseInt(c.slice(i,i+2),16))}
function readPal(){
  const cs=getComputedStyle(document.body),g=n=>hex(cs.getPropertyValue(n));
  const p=g("--paper");DARK=(p[0]+p[1]+p[2])/3<100;
  const s=state.series;
  PAL=s==="chiikawa"?[g("--pink-ink"),g("--sky-ink"),g("--pink-ink")]:s==="kon"?[g("--butter-ink"),g("--navy"),g("--butter-ink")]:[g("--pink-ink"),g("--sky-ink"),g("--butter-ink")];
}
function skySize(){const r=Math.min(devicePixelRatio||1,2);SW=innerWidth;SH=innerHeight;sky.width=SW*r;sky.height=SH*r;sx.setTransform(r,0,0,r,0,0)}
function skySpawn(){
  const n=Math.max(14,Math.min(34,Math.round(SW*SH/16000)));
  NODES=Array.from({length:n},(_,i)=>({x:Math.random()*SW,y:Math.random()*SH,vx:(Math.random()-.5)*.16,vy:(Math.random()-.5)*.16,r:1+Math.random()*1.8,ph:Math.random()*6.28,sp:.6+Math.random()*1.4,c:i%3}));
  COMETS=Array.from({length:3},()=>newComet());
}
function newComet(){const a=Math.floor(Math.random()*NODES.length);return{a,b:nearest(a),t:0,v:.004+Math.random()*.006,wait:Math.random()*200}}
function nearest(a){let best=-1,bd=1e9;NODES.forEach((n,i)=>{if(i===a)return;const d=Math.hypot(n.x-NODES[a].x,n.y-NODES[a].y);if(d<bd&&Math.random()>.25){bd=d;best=i}});return best<0?(a+1)%NODES.length:best}
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
function skyDraw(t){
  sx.clearRect(0,0,SW,SH);
  const D=Math.min(170,SW*.42),la=DARK?.6:.32;
  sx.globalCompositeOperation=DARK?"lighter":"source-over";
  for(const n of NODES){n.x+=n.vx;n.y+=n.vy;if(n.x<-20)n.x=SW+20;if(n.x>SW+20)n.x=-20;if(n.y<-20)n.y=SH+20;if(n.y>SH+20)n.y=-20}
  sx.lineWidth=1;
  for(let i=0;i<NODES.length;i++)for(let j=i+1;j<NODES.length;j++){
    const a=NODES[i],b=NODES[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d>D)continue;
    const k=(1-d/D)*la,gr=sx.createLinearGradient(a.x,a.y,b.x,b.y);
    gr.addColorStop(0,rgba(PAL[a.c],k));gr.addColorStop(1,rgba(PAL[b.c],k));
    sx.strokeStyle=gr;sx.beginPath();sx.moveTo(a.x,a.y);sx.lineTo(b.x,b.y);sx.stroke();
  }
  for(const c of COMETS){
    if(c.wait>0){c.wait--;continue}
    const A=NODES[c.a],B=NODES[c.b];c.t+=c.v;if(c.t>=1){Object.assign(c,newComet(),{a:c.b});c.b=nearest(c.a);c.t=0;continue}
    const x=A.x+(B.x-A.x)*c.t,y=A.y+(B.y-A.y)*c.t,col=PAL[A.c];
    const g=sx.createRadialGradient(x,y,0,x,y,14);g.addColorStop(0,rgba(DARK?[255,250,225]:col,.85));g.addColorStop(1,rgba(col,0));
    sx.fillStyle=g;sx.beginPath();sx.arc(x,y,14,0,6.283);sx.fill();
  }
  for(const n of NODES){
    const tw=.5+.5*Math.sin(t/1000*n.sp+n.ph),col=PAL[n.c],R=n.r*(5+tw*5);
    const g=sx.createRadialGradient(n.x,n.y,0,n.x,n.y,R);
    g.addColorStop(0,rgba(DARK?[255,248,220]:col,DARK?.95:.75));g.addColorStop(.35,rgba(col,DARK?.35:.22));g.addColorStop(1,rgba(col,0));
    sx.fillStyle=g;sx.beginPath();sx.arc(n.x,n.y,R,0,6.283);sx.fill();
    if(tw>.86){const L=n.r*9*(tw-.86)/.14;sx.strokeStyle=rgba(DARK?[255,250,230]:col,.7);sx.lineWidth=1.1;sx.beginPath();sx.moveTo(n.x-L,n.y);sx.lineTo(n.x+L,n.y);sx.moveTo(n.x,n.y-L);sx.lineTo(n.x,n.y+L);sx.stroke();sx.lineWidth=1}
  }
  sx.globalCompositeOperation="source-over";
}
function skyLoop(t){if(!document.hidden)skyDraw(t);if(!reduce)requestAnimationFrame(skyLoop)}
function skyStart(){readPal();skySize();skySpawn();if(reduce)skyDraw(0);else requestAnimationFrame(skyLoop)}
addEventListener("resize",()=>{skySize();skySpawn();if(reduce)skyDraw(0)});
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>{readPal();if(reduce)skyDraw(0)});
new MutationObserver(()=>{readPal();if(reduce)skyDraw(0)}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

/* ---------- events ---------- */
function setSeries(s){state.series=s;document.body.dataset.series=s;readPal();if(reduce)skyDraw(0);document.querySelectorAll(".itab").forEach(b=>b.setAttribute("aria-pressed",b.dataset.s===s));renderStats();render()}
function setView(v){state.view=v;document.body.dataset.view=v;state.delAsk=null;document.querySelectorAll(".btab").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v));render();scrollTo({top:0,behavior:reduce?"auto":"smooth"})}
document.addEventListener("click",e=>{
  const s=e.target.closest(".itab");if(s){setSeries(s.dataset.s);return}
  const c=e.target.closest(".chip[data-c]");if(c){state.cat=c.dataset.c;render();return}
  const r=e.target.closest(".chip[data-r]");if(r){state.region=r.dataset.r;document.querySelectorAll(".chip[data-r]").forEach(b=>b.setAttribute("aria-pressed",b===r));render();return}
  if(e.target.closest("#showEnded")){state.ended=!state.ended;$("#showEnded").setAttribute("aria-pressed",state.ended);render();return}
  const t=e.target.closest(".btab");if(t){setView(t.dataset.v);return}
  const mk=e.target.closest("[data-mark]");if(mk){const id=mk.dataset.id,v=mk.dataset.mark;if(state.marks[id]===v)delete state.marks[id];else{state.marks[id]=v;if(v==="got")state.slam=id}persistMarks();render();return}
  if(e.target.closest("#toMemo")){setView("memo");return}
  if(e.target.closest("#refresh")){loadData(true);return}
  const dm=e.target.closest("[data-delmine]");if(dm){const id=dm.dataset.delmine;if(state.delAsk===id){state.mine=state.mine.filter(x=>x.id!==id);state.delAsk=null;saveMine();mergeItems();toast("지웠어")}else{state.delAsk=id}render();renderStats();return}
  const tm=e.target.closest("[data-tomemo]");if(tm){const it=state.items.find(i=>i.id===tm.dataset.tomemo);if(it){const st=status(it);const date=st.k==="soon"&&!it.approx?it.start:(it.end&&st.k!=="done"?it.end:null);addMemo(it.title+(it.place?"\n@ "+it.place:""),date,false);toast("메모에 붙였어!")}return}
  const md=e.target.closest("[data-mdone]");if(md){const m=state.memos.find(x=>x.id===md.dataset.mdone);if(m){m.done=!m.done;saveMemos();render()}return}
  const mx=e.target.closest("[data-mdel]");if(mx){const id=mx.dataset.mdel;if(state.delAsk===id){state.memos=state.memos.filter(x=>x.id!==id);state.delAsk=null;saveMemos();toast("지웠어")}else{state.delAsk=id}render();return}
  if(e.target.closest("#bkOpen")){state.bkOpen=!state.bkOpen;render();return}
  if(e.target.closest("#bkCopy")){const data=JSON.stringify({v:2,memos:state.memos,marks:state.marks,mine:state.mine});
    const done=()=>toast("백업을 복사했어!");
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(data).then(done,()=>{state.bkOpen=true;render();$("#bkText").value=data;$("#bkText").select();toast("아래 글을 길게 눌러 복사해줘")})}
    else{state.bkOpen=true;render();$("#bkText").value=data;$("#bkText").select()}
    return}
  if(e.target.closest("#bkLoad")){try{const d=JSON.parse($("#bkText").value);if(!Array.isArray(d.memos))throw 0;
      const have=new Set(state.memos.map(m=>m.id));d.memos.forEach(m=>{if(m&&m.id&&!have.has(m.id))state.memos.push(m)});
      state.marks={...state.marks,...(d.marks||{})};if(Array.isArray(d.mine)){const hv=new Set(state.mine.map(x=>x.id));d.mine.forEach(x=>{if(x&&x.id&&!hv.has(x.id))state.mine.push(x)});saveMine();mergeItems()}saveMemos();persistMarks();state.bkOpen=false;render();toast("백업을 불러왔어!")}
    catch(err){toast("백업 글이 아닌 것 같아. 다시 붙여넣어줘")}return}
  const mo=e.target.closest("[data-more]");if(mo){const id=mo.dataset.more;state.open.has(id)?state.open.delete(id):state.open.add(id);render();return}
  const sq=e.target.closest("[data-shopq]");if(sq){$("#q").value=sq.dataset.shopq;state.q=sq.dataset.shopq;state.ended=true;$("#showEnded").setAttribute("aria-pressed","true");setView("feed");return}
});
document.addEventListener("submit",e=>{if(e.target.id!=="memoForm")return;e.preventDefault();
  const t=$("#mText").value.trim();if(!t){toast("내용을 먼저 적어줘");return}
  addMemo(t,$("#mDate").value,$("#mImp").checked);$("#mText").value="";$("#mDate").value="";$("#mImp").checked=false;render();toast("붙였어!")});
let qt;$("#q").addEventListener("input",e=>{clearTimeout(qt);qt=setTimeout(()=>{state.q=e.target.value.trim();render()},120)});
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}
$("#fCats").innerHTML=CATS.map(([k,l])=>`<label><input type="checkbox" name="cat" value="${k}" id="fc-${k}">${l}</label>`).join("");
$("#addBtn").onclick=()=>{$("#fMsg").hidden=true;$("#scrim").hidden=false;$("#fTitle").focus()};
$("#cancel").onclick=()=>$("#scrim").hidden=true;
$("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")$("#scrim").hidden=true});
$("#form").addEventListener("submit",async e=>{
  e.preventDefault();const msg=$("#fMsg");
  const regions=[...document.querySelectorAll("input[name=reg]:checked")].map(i=>i.value);
  const cats=[...document.querySelectorAll("input[name=cat]:checked")].map(i=>i.value);
  if(!regions.length){msg.textContent="지역을 하나 이상 골라줘.";msg.hidden=false;return}
  const link=$("#fLink").value.trim(),brand=$("#fBrand").value.trim();
  const doc={series:$("#fSeries").value,kind:$("#fKind").value,brand:brand||null,title:$("#fTitle").value.trim(),cats,regions,place:$("#fPlace").value.trim(),
    start:$("#fStart").value||null,end:$("#fEnd").value||null,note:$("#fNote").value.trim(),links:link?[{label:"링크",url:link}]:[],addedBy:"user",addedAt:new Date().toISOString()};
  doc.id="mine-"+Date.now().toString(36);doc.mine=true;
  state.mine.unshift(doc);saveMine();mergeItems();$("#scrim").hidden=true;$("#form").reset();render();renderStats();toast("노트에 붙였어!")
});


/* ---------- theme (auto / light / dark) ---------- */
const THEMES=["auto","light","dark"],TLABEL={auto:"자동",light:"밝게",dark:"어둡게"};
const TICO={auto:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>',
 light:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
 dark:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>'};
function applyTheme(t){
  if(t==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",t);
  $("#themeTxt").textContent=TLABEL[t];$("#themeIco").innerHTML=TICO[t];
  const dark=t==="dark"||(t==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",dark?"#1B1F2E":"#FBFCFE");
}
let THEME="auto";try{THEME=localStorage.getItem("tobeol-theme")||"auto";if(!THEMES.includes(THEME))THEME="auto"}catch(e){}
applyTheme(THEME);
$("#themeBtn").addEventListener("click",()=>{THEME=THEMES[(THEMES.indexOf(THEME)+1)%3];try{localStorage.setItem("tobeol-theme",THEME)}catch(e){}applyTheme(THEME);toast(THEME==="auto"?"폰 설정을 따라갈게":THEME==="light"?"밝은 노트로 바꿨어":"어두운 노트로 바꿨어")});
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>applyTheme(THEME));

/* ---------- boot ---------- */
(function(){const d=new Date(Date.now()+9*3600e3);const w="일월화수목금토"[d.getUTCDay()];$("#dateLabel").textContent=`${d.getUTCMonth()+1}월 ${d.getUTCDate()}일 (${w})`})();
state.marks=loadLocal();state.memos=loadMemos();document.body.dataset.series="all";document.body.dataset.view="feed";
render();skyStart();
function loadMine(){try{const v=JSON.parse(localStorage.getItem("tobeol-mine-items")||"[]");return Array.isArray(v)?v:[]}catch(e){return[]}}
function saveMine(){try{localStorage.setItem("tobeol-mine-items",JSON.stringify(state.mine))}catch(e){}}
function mergeItems(){state.items=state.mine.concat(state.remote)}
function stampUpdated(iso){if(!iso)return;const d=new Date(iso);if(isNaN(d))return;const k=new Date(d.getTime()+9*3600e3);
  $("#updated").textContent=`소식 정리: ${k.getUTCMonth()+1}/${k.getUTCDate()} ${String(k.getUTCHours()).padStart(2,"0")}:${String(k.getUTCMinutes()).padStart(2,"0")}`}
async function loadData(manual){
  const btn=$("#refresh");btn.classList.add("spin");
  try{
    const [g,sh]=await Promise.all([fetch("data/goods.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.json()),fetch("data/shops.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.json())]);
    const before=state.remote.length;state.remote=Array.isArray(g.items)?g.items:[];state.shops=Array.isArray(sh.shops)?sh.shops:[];
    try{localStorage.setItem("tobeol-cache",JSON.stringify({g,sh}))}catch(e){}
    stampUpdated(g.updatedAt);mergeItems();state.loaded=true;render();renderStats();
    if(manual)toast(state.remote.length>before&&before?`새 소식 ${state.remote.length-before}개!`:"최신 상태야");
  }catch(err){
    if(!state.loaded){try{const c=JSON.parse(localStorage.getItem("tobeol-cache")||"null");if(c){state.remote=c.g.items||[];state.shops=c.sh.shops||[];stampUpdated(c.g.updatedAt)}}catch(e){}
      mergeItems();state.loaded=true;render();renderStats()}
    if(manual)toast("인터넷 연결을 확인해줘");
  }finally{btn.classList.remove("spin")}
}
state.mine=loadMine();
loadData(false);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)loadData(false)});
</script>
